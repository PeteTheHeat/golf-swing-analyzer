[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "golf-swing-analyzer"
version = "0.1.0"
description = "Local-first golf swing video analysis with evidence-linked pose measurements"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Peter Argany" }]
dependencies = [
  # Newer macOS wheels crash while creating Pose Landmarker graphs on current
  # Apple Silicon (`DrishtiMetalHelper ... graph_service unavailable`).
  "mediapipe==0.10.20",
  "numpy>=1.26,<3",
  "opencv-contrib-python>=4.10,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[project.scripts]
golf-swing = "golf_swing.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/golf_swing"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
