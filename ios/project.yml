name: SwingLab
options:
  bundleIdPrefix: com.peterargany
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES

targets:
  SwingLab:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SwingLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peterargany.SwingLab
        PRODUCT_NAME: SwingLab
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SwingLab
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.sports
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - SwingLabTests
      gatherCoverageData: true

  SwingLabTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SwingLabTests
    dependencies:
      - target: SwingLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peterargany.SwingLabTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SwingLab.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SwingLab"
        BUNDLE_LOADER: "$(TEST_HOST)"
