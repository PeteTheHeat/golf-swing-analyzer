name: test

on:
  push:
  pull_request:

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest

  ios:
    name: iOS
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Select an available iPhone simulator
        id: simulator
        run: |
          SIMULATOR_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          test -n "$SIMULATOR_ID"
          echo "id=$SIMULATOR_ID" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: |
          xcodebuild \
            -project ios/SwingLab.xcodeproj \
            -scheme SwingLab \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -resultBundlePath "$RUNNER_TEMP/SwingLabTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Preserve failing test result
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SwingLabTests-xcresult
          path: ${{ runner.temp }}/SwingLabTests.xcresult
